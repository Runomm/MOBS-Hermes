# Hermes — Codemagic CI.
#
# Amaç: Mac olmadan iPhone 17 Pro Max'te test. Mehmet'in yalnızca ÜCRETSİZ
# Apple ID'si var → burada İMZASIZ bir .ipa üretiyoruz; imzalamayı Windows'ta
# Sideloadly (veya AltStore) ücretsiz Apple ID ile yapar (7 günlük geçerlilik,
# dolunca yeniden imzala/kur).
#
# Kullanım:
#   1. Bu repo'yu Codemagic'e bağla (codemagic.io → Add application → GitHub
#      Runomm/MOBS-Hermes). codemagic.yaml otomatik bulunur.
#   2. "ios-unsigned" workflow'unu çalıştır.
#   3. Bittiğinde Artifacts'ten Hermes-unsigned.ipa indir.
#   4. Windows'ta Sideloadly aç → iPhone'u USB'ye tak → IPA'yı sürükle →
#      ücretsiz Apple ID gir → Start. (Sideloadly bundle id'yi gerekirse
#      değiştirir ve 7 günlük sertifikayla imzalar.)

workflows:
  ios-unsigned:
    name: Hermes iOS (imzasız IPA — sideload)
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: Hermes/hermes
    environment:
      flutter: 3.41.6
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Pod install (Podfile platform :ios, '16.0')
        script: |
          cd ios
          pod install --repo-update
      - name: Flutter config (Dart/asset + xcconfig hazırla, derleme yapma)
        script: flutter build ios --release --no-codesign --config-only
      - name: Build unsigned .app (xcodebuild, imza tamamen kapalı)
        # flutter build ios --no-codesign Runner target'ın otomatik imzasını
        # tam bypass etmiyor (Development Team ister). xcodebuild'i doğrudan
        # CODE_SIGNING_ALLOWED=NO ile çağırınca imza hiç denenmez; Dart/asset
        # derlemesi xcode_backend (flutter assemble) build phase'inde olur.
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios_unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: Package unsigned IPA
        script: |
          cd build/ios_unsigned/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -r9 Hermes-unsigned.ipa Payload
    artifacts:
      - Hermes/hermes/build/ios_unsigned/Build/Products/Release-iphoneos/*.ipa
